<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tiny-voca-nl</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 44rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui,sans-serif; }
  label, textarea { display: block; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .65rem; margin: .4rem 0 1rem; }
  button, input { font: inherit; margin: .4rem .4rem .4rem 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<main>
  <h1>tiny-voca-nl</h1>
  <p>Nederlandse spraak, lokaal in je browser.</p>
  <div>
    <label for="text" style="display: inline">Tekst</label>
    <a href="#text" data-example="De trein naar Utrecht vertrekt over vijf minuten. Zorg dat je op tijd instapt en vergeet je spullen niet mee te nemen.">1</a>
    <a href="#text" data-example="Wat een heerlijk weertje vandaag! De zon schijnt, het is lekker warm en er staat bijna geen wind. Zullen we even naar buiten gaan?">2</a>
    <a href="#text" data-example="Wie mij niet kent, zal mijn naam niet weten. Wie mij wel kent, zal die niet verraden. Maar voor u ben ik degene die u een brief geeft voor de koning aan de overkant van de bergen.">3</a>
    <a href="#text" data-example="Morgen fietsen we langs de rivier naar de markt. Daar kopen we wat vers fruit en drinken we gezellig een kopje koffie. Hopelijk is het mooi weer!">4</a>
  </div>
  <textarea id="text" rows="6" maxlength="5000">De trein naar Utrecht vertrekt over vijf minuten. Zorg dat je op tijd instapt en vergeet je spullen niet mee te nemen.</textarea>
  <label>Spreeksnelheid <input id="speed" type="number" min="0.25" max="4" step="0.05" value="1"></label>
  <button id="play" disabled>Voorlezen</button><button id="stop" disabled>Stop</button><button id="save" disabled>WAV opslaan</button>
  <p id="loading" role="status">Model downloaden… <span id="spinner" aria-hidden="true">/</span></p>
  <p id="error" role="alert" hidden></p>
  <pre id="phones"></pre>
</main>
<footer>
  <hr>
  <p>
    <strong><a href="https://huggingface.co/xxy998/tiny-voca-nl" target="_blank" rel="noopener noreferrer">tiny-voca-nl</a></strong> leest Nederlandse tekst voor zonder die naar een server te sturen.
    Het model heeft 4,54 miljoen parameters en genereert mono-audio op 24 kHz.
    Het ONNX-model is 22,5 MB.
  </p>
</footer>
<script src="player.js"></script>
<script type="module" src="app.mjs"></script>
</html>
