[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-voca-nl"
version = "0.1.0"
description = "Compact Dutch text-to-speech with offline CPU inference"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.24,<3", "soundfile>=0.12,<1"]

[project.urls]
Repository = "https://github.com/tetsuo/tiny-voca-nl"

[project.optional-dependencies]
# Optional English compatibility; Dutch inference uses eSpeak NG.
own = ["dizione @ git+https://github.com/n4ze3m/dizione"]
prepare = ["librosa>=0.10.2,<1", "pyarrow>=15", "huggingface-hub>=0.34,<2"]
# Annotation only: the pretrained phoneme recogniser used for forced alignment.
annotate = ["transformers>=4.40,<5", "torchaudio>=2.1,<3", "scipy>=1.10,<2", "huggingface-hub>=0.34,<2"]
# Evaluation only: ASR scoring and comparison with recordings.
evaluate = ["faster-whisper>=1.0,<2", "jiwer>=3,<5", "librosa>=0.10.2,<1", "scipy>=1.10,<2"]

[project.scripts]
tiny-voca-nl-prepare = "tiny_voca.prepare:main"
tiny-voca-nl-annotate = "tiny_voca.annotate:main"
tiny-voca-nl-train = "tiny_voca.train:main"
tiny-voca-nl-evaluate = "tiny_voca.evaluate:main"
tiny-voca-nl-speak = "tiny_voca.infer:main"
tiny-voca-nl-inspect = "tiny_voca.inspect:main"

[tool.setuptools.packages.find]
where = ["src"]
